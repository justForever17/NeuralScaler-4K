name: Build Portable Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.2.0)'
        required: false
        default: 'v2.2.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package NeuralScaler 4K
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Assemble Portable Package
        run: python scripts/build_portable_release.py

      - name: Create Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release\NeuralScaler-4K-Portable" -DestinationPath "release\NeuralScaler-4K-Portable-windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuralScaler-4K-Portable-windows-x64
          path: release/NeuralScaler-4K-Portable-windows-x64.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/NeuralScaler-4K-Portable-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
