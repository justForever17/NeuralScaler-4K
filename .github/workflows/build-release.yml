name: Build Portable Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.2.0)'
        required: false
        default: 'v2.2.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package NeuralScaler 4K
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assemble Portable Package
        run: python scripts/build_portable_release.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Standalone Single-File Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" scripts/installer.iss

      - name: Run Installer Lifecycle & Zero-Residue Acceptance Test
        shell: pwsh
        run: |
          pwsh tests/e2e/test_installer_lifecycle.ps1 -SetupExe release/NeuralScaler-4K-Setup-v2.2.0.exe

      - name: Run Python Test Suite
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Create Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "release\NeuralScaler-4K-Portable" -DestinationPath "release\NeuralScaler-4K-Portable-windows-x64.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeuralScaler-4K-Release-Assets
          path: |
            release/NeuralScaler-4K-Setup-v2.2.0.exe
            release/NeuralScaler-4K-Portable-windows-x64.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NeuralScaler-4K-Setup-v2.2.0.exe
            release/NeuralScaler-4K-Portable-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if (-not $env:NPM_TOKEN) {
            Write-Warning "[Notice] NPM_TOKEN secret is not set in repository settings. Skipping npm publish."
            Write-Warning "To enable automatic npm publish, add your npm token as NPM_TOKEN in GitHub Repository Secrets."
            exit 0
          }
          Write-Host "[Info] Authenticating with npm registry..."
          npm config set //registry.npmjs.org/:_authToken $env:NPM_TOKEN
          Write-Host "[Info] Publishing neuralscaler to npm registry..."
          npm publish --access public
          Write-Host "[Success] Package published to npm successfully!"
